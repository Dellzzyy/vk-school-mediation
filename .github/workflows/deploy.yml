name: Deploy to VK Mini Apps Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy to VK Hosting
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
        run: npm run deploy

      - name: Verify App Status and URLs
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
        run: |
          echo "=== 1. Check apps.get from VK API ==="
          curl -s "https://api.vk.com/method/apps.get?app_id=54776741&platform=all&extended=1&v=5.131&access_token=${MINI_APPS_ACCESS_TOKEN}" || true
          echo ""
          echo "=== 2. Check curl prod URL ==="
          curl -sI -m 10 "https://prod-app54776741-2b9f63a792a4.pages-ac.vk-apps.ru/index.html" || true
